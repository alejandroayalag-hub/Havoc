# Una instalación = un proyecto compose: docker compose -p <instancia> --env-file backend/.env up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?define DB_NAME en .env}
      POSTGRES_USER: ${DB_USER:?define DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
    ports:
      # solo localhost: el backend corre en el mismo host
      - "127.0.0.1:${DB_PORT:?define DB_PORT en .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
